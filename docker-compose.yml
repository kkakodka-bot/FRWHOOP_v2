# FRWHOOP Node API. TLS terminates at the reverse proxy / platform.
# Production: set NODE_ENV=production and the secrets listed in backend/.env.example.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      FRWHOOP_RUNTIME: production
      FRWHOOP_ALLOW_DEV_USER: "false"
      FRWHOOP_LOCAL_USER_ID: ""
      PORT: "8080"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend-data:
