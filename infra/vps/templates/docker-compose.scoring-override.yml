# Installed as /opt/frwhoop/supabase-docker/docker/docker-compose.scoring.yml.
# /opt/frwhoop/scoring.env holds the hosted database and PostgREST destinations.
services:
  scoring-physiology-v2:
    image: frwhoop/scoring-service:${SCORING_IMAGE_TAG:?SCORING_IMAGE_TAG is required}
    container_name: scoring-physiology-v2
    restart: unless-stopped
    env_file:
      - /opt/frwhoop/scoring.env
      - /opt/frwhoop/b2.env
    environment:
      SCORING_ALGORITHM_VERSION: frwhoop-physiology-2
    command: []
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/bin/service || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
